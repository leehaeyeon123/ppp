<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 이해연 포트폴리오</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .auth-container { max-width: 400px; margin: 100px auto; padding: 40px 30px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; text-align: center; color: #1a202c; font-family:'Gowun Batang'; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #4a5568; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .form-group input:focus { outline: none; border-color: var(--accent, #3b82f6); }
    .btn-submit { width: 100%; padding: 12px; background: #1a202c; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    .auth-link { text-align: center; margin-top: 20px; font-size: 0.85rem; }
    .auth-link a { color: #4a5568; text-decoration: underline; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./index.html">이해연<span>.</span></a>
</nav>

<div class="auth-container">
  <h2 class="auth-title">로그인</h2>
  <div class="form-group">
    <label for="admin-id">아이디</label>
    <input type="text" id="admin-id" placeholder="아이디를 입력하세요">
  </div>
  <div class="form-group">
    <label for="admin-pw">비밀번호</label>
    <input type="password" id="admin-pw" placeholder="비밀번호를 입력하세요" onkeydown="if(event.key==='Enter') handleLogin()">
  </div>
  <button class="btn-submit" onclick="handleLogin()">로그인</button>
  <div class="auth-link">
    처음이신가요? <a href="./signup.html">일반 회원가입하기</a>
  </div>
</div>

<script>
  function handleLogin() {
    const idInput = document.getElementById('admin-id').value.trim();
    const pwInput = document.getElementById('admin-pw').value;
    
    const masterId = "leehaeyeon";
    const masterPw = "1234"; 

    let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
    const matchedUser = users.find(user => user.id === idInput && user.password === pwInput);

    if (idInput === masterId && pwInput === masterPw) {
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userRole', 'admin');
      alert('반갑습니다, 해연님! 관리자 모드로 진입합니다.');
      window.location.href = "./index.html"; 
    } else if (matchedUser) {
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userRole', matchedUser.role || 'user');
      alert(`반갑습니다, ${idInput}님!`);
      window.location.href = "./index.html";
    } else {
      alert('아이디 또는 비밀번호가 일치하지 않습니다.');
      document.getElementById('admin-pw').value = '';
      document.getElementById('admin-id').focus();
    }
  }
</script>
</body>
</html>
