<!-- [login.html] 스크립트 영역 수정 -->
<script>
  function handleLogin() {
    const idInput = document.getElementById('admin-id').value.trim();
    const pwInput = document.getElementById('admin-pw').value;
    
    const masterId = "leehaeyeon";
    const masterPw = "1234"; 

    let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
    const matchedUser = users.find(user => user.id === idInput && user.password === pwInput);

    if (idInput === masterId && pwInput === masterPw) {
      // 마스터 최고 관리자 계정 로그인
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userRole', 'admin');
      alert('반갑습니다, 해연님! 관리자 모드로 진입합니다.');
      window.location.href = "./index.html"; 
    } else if (matchedUser) {
      // 일반 회원 또는 가입된 유저 로그인
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userRole', matchedUser.role || 'user');
      alert(`반갑습니다, ${idInput}님!`);
      window.location.href = "./index.html";
    } else {
      alert('아이디 또는 비밀번호가 일치하지 않습니다.');
      document.getElementById('admin-pw').value = '';
      document.getElementById('admin-id').focus();
    }
  }
</script>
