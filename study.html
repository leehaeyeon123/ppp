<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>공부기록 — 이해연</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./study.css"/>
  <style>
    /* ==========================================================================
       [통일] 마크다운 및 커스텀 스타일 렌더링 서식
       ========================================================================== */
    .post-view-body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.75;
      word-wrap: break-word;
    }

    .post-view-body strong {
      font-weight: 700;
      color: var(--accent) !important;
    }
    .post-view-body em {
      font-style: italic;
      color: inherit;
    }
    .post-view-body u {
      text-decoration: underline;
      text-underline-position: under;
    }
    
    .btn-auth { cursor: pointer; color: var(--muted) !important; font-weight: 500; }
    .btn-auth:hover { color: var(--accent) !important; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./index.html">이해연<span>.</span></a>
  <div class="nav-links">
    <a href="index.html#about">소개</a>
    <a href="index.html#skills">관심사</a>
    <a href="index.html#projects">프로젝트</a>
    <a href="./board.html">게시판</a>
    <a href="./study.html" class="active">공부기록</a>
    <a href="index.html#contact">연락처</a>
    <a id="auth-btn" class="btn-auth">로그인</a>
  </div>
</nav>

<div class="wrap">
  <div id="list-view">
    <p class="page-label">Study</p>
    <h1 class="page-title">공부한 내용</h1>
    <div class="study-top">
      <div class="filter-btns">
        <button class="filter-btn active" onclick="setFilter('전체')">전체</button>
        <button class="filter-btn" onclick="setFilter('기획')">기획</button>
        <button class="filter-btn" onclick="setFilter('마케팅')">마케팅</button>
        <button class="filter-btn" onclick="setFilter('기타')">기타</button>
      </div>
      <button class="btn-write" id="main-write-btn" onclick="openWrite()" style="display: none;">기록 추가</button>
    </div>
    <p class="study-count">총 <span id="post-count">0</span>개의 기록이 있습니다.</p>
    <div class="cards-grid" id="cards-grid">
      <div class="cards-empty" id="cards-empty">아직 작성된 기록이 없습니다.</div>
    </div>
  </div>

  <div id="post-view" class="post-view">
    <p class="page-label">Study</p>
    <span class="post-view-tag" id="view-tag"></span>
    <div class="post-view-title" id="view-title"></div>
    <div class="post-view-meta" id="view-meta"></div>
    <div class="post-view-body" id="view-body"></div>
    <div class="post-view-imgs" id="view-imgs"></div>
    <div class="post-view-actions">
      <button class="btn-back" onclick="closePost()">← 목록으로</button>
      <button class="btn-edit" id="view-edit-btn" onclick="openEdit()" style="display: none;">수정</button>
      <button class="btn-delete" id="view-delete-btn" onclick="deletePost()" style="display: none;">삭제</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="write-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeWrite()">✕</button>
    <div class="modal-title">기록 추가</div>
    <input type="text" id="input-title" placeholder="제목을 입력하세요"/>
    <select id="input-cat">
      <option value="기획">기획</option>
      <option value="마케팅">마케팅</option>
      <option value="기타">기타</option>
    </select>
    <textarea id="input-body" placeholder="공부한 내용을 입력하세요. (**굵게**, _밑줄_, /기울임/ 문법 적용 시 기호는 자동으로 제거됩니다.)"></textarea>
    <label class="img-upload-label">
      📎 이미지 첨부 (여러 장 가능)
      <input type="file" id="input-imgs" accept="image/*" multiple style="display:none" onchange="previewImgs('input-imgs','input-preview')"/>
    </label>
    <div class="img-preview-wrap" id="input-preview"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeWrite()">취소</button>
      <button class="btn-submit" onclick="submitPost()">등록</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeEdit()">✕</button>
    <div class="modal-title">기록 수정</div>
    <input type="text" id="edit-title" placeholder="제목을 입력하세요"/>
    <select id="edit-cat">
      <option value="기획">기획</option>
      <option value="마케팅">마케팅</option>
      <option value="기타">기타</option>
    </select>
    <textarea id="edit-body" placeholder="공부한 내용을 입력하세요"></textarea>
    <label class="img-upload-label">
      📎 이미지 첨부 (여러 장 가능)
      <input type="file" id="edit-imgs" accept="image/*" multiple style="display:none" onchange="previewImgs('edit-imgs','edit-preview')"/>
    </label>
    <div class="img-preview-wrap" id="edit-preview"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeEdit()">취소</button>
      <button class="btn-submit" onclick="submitEdit()">저장</button>
    </div>
  </div>
</div>

<script>
  let posts = JSON.parse(localStorage.getItem('studyPosts')) || [];
  let currentFilter = '전체';
  let currentIdx = -1;
  let inputImgData = [];
  let editImgData = [];
  
  const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
  const isAdmin = localStorage.getItem('userRole') === 'admin';

  window.onload = function() {
    if (isLoggedIn && isAdmin) {
      document.getElementById('main-write-btn').style.display = 'block';
    }
    renderCards();
    updateAuthUI();
  }

  function updateAuthUI() {
    const authBtn = document.getElementById('auth-btn');
    if (isLoggedIn) {
      authBtn.textContent = '로그아웃';
      authBtn.onclick = function() {
        if (confirm('로그아웃 하시겠습니까?')) {
          localStorage.removeItem('isLoggedIn');
          localStorage.removeItem('userRole');
          alert('로그아웃 되었습니다.');
          window.location.reload();
        }
      };
    } else {
      authBtn.textContent = '로그인';
      authBtn.onclick = function() {
        window.location.href = "./login.html";
      };
    }
  }

  function saveToLocalStorage() {
    localStorage.setItem('studyPosts', JSON.stringify(posts));
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === f));
    renderCards();
  }

  // 카드 미리보기 메인에서 서식 기호를 완벽하게 제거하는 필터 함수
  function cleanPreviewText(str) {
    if(!str) return "";
    return str
      .replace(/\*\*([\s\S]*?)\*\*/g, '$1')
      .replace(/\/\/([\s\S]*?)\/\//g, '$1')
      .replace(/\/([^\/]+?)\//g, '$1') // 정규식 슬래시 누락 오타 및 패턴 안정화 수정
      .replace(/_([\s\S]*?)_/g, '$1')
      .trim();
  }

  // 기호를 완벽히 정제하여 가공하는 단독 파서 함수
  function parseContent(text) {
    if(!text) return "";
    
    // 1. HTML 엔티티 이스케이프
    let escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    // 2. **굵게** 처리
    escaped = escaped.replace(/\*\*([^\*]+?)\*\*/g, '<strong>$1</strong>');
    
    // 3. //기울임// 처리
    escaped = escaped.replace(/\/\/([^\/]+?)\/\//g, '<em>$1</em>');
    
    // 4. /기울임/ 처리 (태그 내부 슬래시 치환 에러 방지용 패턴)
    escaped = escaped.replace(/\/([^<>\/]+?)\//g, '<em>$1</em>');
    
    // 5. _밑줄_ 처리
    escaped = escaped.replace(/_([^_]+?)_/g, '<u>$1</u>');
    
    // 6. 최종 줄바꿈 변환
    return escaped.replace(/\n/g, '<br>');
  }

  function renderCards() {
    const grid = document.getElementById('cards-grid');
    const filtered = currentFilter === '전체' ? posts : posts.filter(p => p.cat === currentFilter);
    document.getElementById('post-count').textContent = filtered.length;
    if (filtered.length === 0) { grid.innerHTML = '<div class="cards-empty">해당하는 기록이 없습니다.</div>'; return; }
    
    grid.innerHTML = filtered.slice().reverse().map(p => {
      const idx = posts.indexOf(p);
      const imgHtml = p.imgs && p.imgs[0] ? `<img class="card-img" src="${p.imgs[0]}" alt=""/>` : '';
      const previewText = cleanPreviewText(p.body).slice(0, 70);
      
      return `<div class="study-card" onclick="viewPost(${idx})">
        ${imgHtml}
        <div class="card-top"><span class="card-tag">${p.cat}</span><span class="card-date">${p.date}</span></div>
        <div class="card-title">${p.title}</div>
        <div class="card-preview">${previewText}${cleanPreviewText(p.body).length > 70 ? '...' : ''}</div>
      </div>`;
    }).join('');
  }

  function previewImgs(inputId, previewId) {
    const files = document.getElementById(inputId).files;
    const wrap = document.getElementById(previewId);
    const dataArr = inputId === 'input-imgs' ? inputImgData : editImgData;
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        dataArr.push(e.target.result);
        const div = document.createElement('div');
        div.className = 'img-remove';
        div.innerHTML = `<img src="${e.target.result}" style="width:80px;height:80px;object-fit:cover;border:1px solid var(--border)"/>
          <button class="img-remove-btn" onclick="removePreviewImg(this, '${previewId}', ${dataArr.length-1})">✕</button>`;
        wrap.appendChild(div);
      };
      reader.readAsDataURL(file);
    });
  }

  function removePreviewImg(btn, previewId, idx) {
    const dataArr = previewId === 'input-preview' ? inputImgData : editImgData;
    dataArr.splice(idx, 1);
    btn.parentElement.remove();
  }

  function openWrite() {
    if (!isLoggedIn || !isAdmin) { alert('관리자 계정만 작성 가능합니다.'); return; }
    inputImgData = [];
    document.getElementById('input-preview').innerHTML = '';
    document.getElementById('write-modal').classList.add('open');
    document.getElementById('input-title').focus();
  }
  
  function closeWrite() {
    document.getElementById('write-modal').classList.remove('open');
    document.getElementById('input-title').value = '';
    document.getElementById('input-body').value = '';
    document.getElementById('input-preview').innerHTML = '';
    inputImgData = [];
  }
  
  function submitPost() {
    if (!isLoggedIn || !isAdmin) return;
    const title = document.getElementById('input-title').value.trim();
    const cat = document.getElementById('input-cat').value;
    const body = document.getElementById('input-body').value;
    if (!title || !body.trim()) { alert('내용을 입력해주세요.'); return; }
    
    const now = new Date();
    const date = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
    
    posts.push({title, cat, body, date, imgs: [...inputImgData]});
    saveToLocalStorage();
    closeWrite(); 
    renderCards();
  }

  function viewPost(idx) {
    currentIdx = idx;
    const p = posts[idx];
    document.getElementById('view-tag').textContent = p.cat;
    document.getElementById('view-title').textContent = p.title;
    document.getElementById('view-meta').textContent = p.date;
    
    document.getElementById('view-body').innerHTML = parseContent(p.body);
    
    const imgsWrap = document.getElementById('view-imgs');
    imgsWrap.innerHTML = (p.imgs || []).map(src => `<img src="${src}" alt=""/>`).join('');
    
    if (isLoggedIn && isAdmin) {
      document.getElementById('view-edit-btn').style.display = 'inline-block';
      document.getElementById('view-delete-btn').style.display = 'inline-block';
    } else {
      document.getElementById('view-edit-btn').style.display = 'none';
      document.getElementById('view-delete-btn').style.display = 'none';
    }

    document.getElementById('list-view').style.display = 'none';
    document.getElementById('post-view').style.display = 'block';
  }
  
  function closePost() {
    currentIdx = -1;
    document.getElementById('list-view').style.display = 'block';
    document.getElementById('post-view').style.display = 'none';
  }

  function openEdit() {
    if (!isLoggedIn || !isAdmin) return;
    const p = posts[currentIdx];
    editImgData = [...(p.imgs || [])];
    document.getElementById('edit-title').value = p.title;
    document.getElementById('edit-cat').value = p.cat;
    document.getElementById('edit-body').value = p.body;
    const wrap = document.getElementById('edit-preview');
    wrap.innerHTML = editImgData.map((src, i) =>
      `<div class="img-remove"><img src="${src}" style="width:80px;height:80px;object-fit:cover;border:1px solid var(--border)"/>
        <button class="img-remove-btn" onclick="removePreviewImg(this,'edit-preview',${i})">✕</button></div>`
    ).join('');
    document.getElementById('edit-modal').classList.add('open');
  }
  
  function closeEdit() { document.getElementById('edit-modal').classList.remove('open'); }
  
  function submitEdit() {
    if (!isLoggedIn || !isAdmin) return;
    const title = document.getElementById('edit-title').value.trim();
    const cat = document.getElementById('edit-cat').value;
    const body = document.getElementById('edit-body').value;
    if (!title || !body.trim()) { alert('내용을 입력해주세요.'); return; }
    
    posts[currentIdx] = { ...posts[currentIdx], title, cat, body, imgs: [...editImgData] };
    saveToLocalStorage();
    closeEdit(); 
    viewPost(currentIdx); 
    renderCards();
  }

  function deletePost() {
    if (!isLoggedIn || !isAdmin) return;
    if (!confirm('이 기록을 삭제하시겠습니까?')) return;
    posts.splice(currentIdx, 1);
    saveToLocalStorage();
    closePost(); 
    renderCards();
  }
</script>
</body>
</html>
