<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 — 이해연 포트폴리오</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .auth-container { max-width: 400px; margin: 100px auto; padding: 40px 30px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; text-align: center; color: #1a202c; font-family:'Gowun Batang'; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #4a5568; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .form-group input:focus { outline: none; border-color: var(--accent, #3b82f6); }
    .error-msg { font-size: 0.8rem; color: #ef4444; margin-top: 4px; display: none; }
    .btn-submit { width: 100%; padding: 12px; background: #1a202c; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    .auth-link { text-align: center; margin-top: 20px; font-size: 0.85rem; }
    .auth-link a { color: #4a5568; text-decoration: underline; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./index.html">이해연<span>.</span></a>
</nav>

<div class="auth-container">
  <h2 class="auth-title">일반 회원가입</h2>
  <form id="signup-form" onsubmit="handleSignup(event)">
    <div class="form-group">
      <label for="user-id">아이디</label>
      <input type="text" id="user-id" placeholder="사용할 아이디 입력" required>
      <div id="id-error" class="error-msg">이미 존재하는 아이디입니다.</div>
    </div>
    <div class="form-group">
      <label for="user-pw">비밀번호</label>
      <input type="password" id="user-pw" placeholder="비밀번호 입력" required>
    </div>
    <div class="form-group">
      <label for="user-pw-confirm">비밀번호 확인</label>
      <input type="password" id="user-pw-confirm" placeholder="비밀번호 재입력" required>
      <div id="pw-error" class="error-msg">비밀번호가 일치하지 않습니다.</div>
    </div>
    <button type="submit" class="btn-submit">가입하기</button>
  </form>
  <div class="auth-link">
    이미 계정이 있으신가요? <a href="./login.html">로그인하기</a>
  </div>
</div>

<script>
  function handleSignup(event) {
    event.preventDefault();
    const idInput = document.getElementById('user-id').value.trim();
    const pwInput = document.getElementById('user-pw').value;
    const pwConfirmInput = document.getElementById('user-pw-confirm').value;

    document.getElementById('id-error').style.display = 'none';
    document.getElementById('pw-error').style.display = 'none';

    if (pwInput !== pwConfirmInput) {
      document.getElementById('pw-error').style.display = 'block';
      return;
    }

    let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];

    if (idInput === "leehaeyeon" || users.some(user => user.id === idInput)) {
      document.getElementById('id-error').style.display = 'block';
      return;
    }

    users.push({ id: idInput, password: pwInput, role: 'user' });
    localStorage.setItem('registeredUsers', JSON.stringify(users));

    alert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
    window.location.href = "./login.html";
  }
</script>
</body>
</html>
