<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입 — 이해연 포트폴리오</title>
  <link rel="stylesheet" href="./style.css">
  
  <style>
    /* 로그인/회원가입 전용 미니멀 스타일 박스 */
    .auth-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 40px 30px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
      color: #1a202c;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #4a5568;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent, #3b82f6); /* 기존 accent 컬러 연동 */
    }
    .error-msg {
      font-size: 0.8rem;
      color: #ef4444;
      margin-top: 4px;
      display: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #1a202c;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #2d3748;
    }
    .auth-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
    }
    .auth-link a {
      color: #4a5568;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./index.html">이해연<span>.</span></a>
</nav>

<div class="auth-container">
  <h2 class="auth-title">관리자 회원가입</h2>
  <form id="signup-form" onsubmit="handleSignup(event)">
    
    <div class="form-group">
      <label for="admin-id">아이디</label>
      <input type="text" id="admin-id" placeholder="사용할 아이디 입력" required>
      <div id="id-error" class="error-msg">이미 존재하는 아이디입니다.</div>
    </div>

    <div class="form-group">
      <label for="admin-pw">비밀번호</label>
      <input type="password" id="admin-pw" placeholder="비밀번호 입력" required>
    </div>

    <div class="form-group">
      <label for="admin-pw-confirm">비밀번호 확인</label>
      <input type="password" id="admin-pw-confirm" placeholder="비밀번호 재입력" required>
      <div id="pw-error" class="error-msg">비밀번호가 일치하지 않습니다.</div>
    </div>

    <button type="submit" class="btn-submit">가입하기</button>
  </form>

  <div class="auth-link">
    이미 계정이 있으신가요? <a href="./login.html">로그인하기</a>
  </div>
</div>

<script>
  function handleSignup(event) {
    event.preventDefault(); // 폼 제출 시 페이지 새로고침 방지

    // 요소 가져오기
    const idInput = document.getElementById('admin-id').value.trim();
    const pwInput = document.getElementById('admin-pw').value;
    const pwConfirmInput = document.getElementById('admin-pw-confirm').value;

    // 에러 메시지 초기화
    document.getElementById('id-error').style.display = 'none';
    document.getElementById('pw-error').style.display = 'none';

    // 1. 비밀번호 일치 확인
    if (pwInput !== pwConfirmInput) {
      document.getElementById('pw-error').style.display = 'block';
      return;
    }

    // 2. 로컬스토리지에서 기존 회원 목록 가져오기
    let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];

    // 3. 아이디 중복 체크
    const isIdDup = users.some(user => user.id === idInput);
    if (isIdDup) {
      document.getElementById('id-error').style.display = 'block';
      return;
    }

    // 4. 회원가입 처리 (회원 정보 저장)
    users.push({ id: idInput, password: pwInput });
    localStorage.setItem('registeredUsers', JSON.stringify(users));

    alert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
    window.location.href = "./login.html"; // 로그인 페이지로 리다이렉트
  }
</script>

</body>
</html>
