<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>게시판 — 이해연</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./boardstyle.css">
  <style>
    /* ==========================================================================
       마크다운 렌더링 서식 (전체 문법 지원)
       ========================================================================== */
    .post-view-body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.85;
      word-wrap: break-word;
    }
    .post-view-body h1,.post-view-body h2,.post-view-body h3,
    .post-view-body h4,.post-view-body h5,.post-view-body h6 {
      font-family: 'Gowun Batang', serif;
      color: var(--text);
      margin: 1.4em 0 .5em;
      line-height: 1.3;
    }
    .post-view-body h1 { font-size: 1.7em; border-bottom: 2px solid var(--border); padding-bottom: .3em; }
    .post-view-body h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
    .post-view-body h3 { font-size: 1.2em; }
    .post-view-body h4 { font-size: 1.05em; }
    .post-view-body h5,.post-view-body h6 { font-size: .95em; color: var(--muted); }
    .post-view-body strong { font-weight: 700; color: var(--accent); }
    .post-view-body em { font-style: italic; }
    .post-view-body u { text-decoration: underline; text-underline-position: under; }
    .post-view-body del { text-decoration: line-through; color: var(--muted); }
    .post-view-body code {
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: .1em .4em;
      font-size: .88em;
      color: var(--accent);
    }
    .post-view-body pre {
      background: #1e1a16;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.2em 1.4em;
      overflow-x: auto;
      margin: 1em 0;
    }
    .post-view-body pre code {
      background: none; border: none; padding: 0;
      color: #e8a87c; font-size: .85em;
    }
    .post-view-body blockquote {
      border-left: 3px solid var(--accent2);
      margin: 1em 0; padding: .6em 1.2em;
      background: var(--bg2); color: var(--muted); font-style: italic;
    }
    .post-view-body blockquote p { margin: 0; }
    .post-view-body ul,.post-view-body ol { margin: .7em 0; padding-left: 1.8em; }
    .post-view-body li { margin: .25em 0; }
    .post-view-body hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
    .post-view-body a { color: var(--accent); text-decoration: underline; }
    .post-view-body a:hover { color: var(--accent2); }
    .post-view-body img { max-width: 100%; border: 1px solid var(--border); margin: .5em 0; }
    .post-view-body table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: .88em; }
    .post-view-body th { background: var(--bg2); border: 1px solid var(--border); padding: .5em .9em; font-weight: 600; text-align: left; }
    .post-view-body td { border: 1px solid var(--border); padding: .45em .9em; }
    .post-view-body tr:nth-child(even) td { background: var(--bg); }
    .post-view-body p { margin: .5em 0; }
    
    .btn-auth { cursor: pointer; color: var(--muted) !important; font-weight: 500; }
    .btn-auth:hover { color: var(--accent) !important; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="./index.html">이해연<span>.</span></a>
  <div class="nav-links">
    <a href="index.html#about">소개</a>
    <a href="index.html#skills">관심사</a>
    <a href="index.html#projects">프로젝트</a>
    <a href="board.html" class="active">게시판</a>
    <a href="./study.html">공부기록</a>
    <a href="index.html#contact">연락처</a>
    <a id="auth-btn" class="btn-auth">로그인</a>
  </div>
</nav>

<div class="wrap">
  <div id="list-view">
    <p class="page-label">Board</p>
    <h1 class="page-title">게시판</h1>
    <div class="board-top">
      <span class="board-count">총 <span id="post-count">0</span>개의 글이 있습니다.</span>
      <button class="btn-write" id="main-write-btn" onclick="openWrite()" style="display: none;">글 작성</button>
    </div>
    <table>
      <thead><tr><th class="td-num">번호</th><th>제목</th><th class="td-date">날짜</th></tr></thead>
      <tbody id="post-tbody"></tbody>
    </table>
    <div class="board-empty" id="board-empty">아직 작성된 글이 없습니다.</div>
  </div>

  <div id="post-view" class="post-view">
    <p class="page-label">Post View</p>
    <div class="post-view-title" id="view-title"></div>
    <div class="post-view-meta" id="view-meta"></div>
    <div class="post-view-body" id="view-body"></div>
    <div class="view-btns">
      <button class="btn-back" onclick="closePost()">← 목록으로</button>
      <button class="btn-edit" id="edit-btn" style="display:none; padding:.6rem 1.4rem; border:1px solid #e8ddd3; background:#c0622f; color:#fff; font-size:.78rem; cursor:pointer;">수정하기</button>
      <button class="btn-delete" id="delete-btn" style="display:none;">삭제하기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="write-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeWrite()" style="position:absolute; top:1rem; right:1rem; background:none; border:none; cursor:pointer;">✕</button>
    <div id="modal-title" style="font-family:'Gowun Batang'; font-size:1.4rem; margin-bottom:1.5rem;">글 작성</div>
    <input type="text" id="input-title" placeholder="제목을 입력하세요"/>
    <textarea id="input-body" placeholder="마크다운 문법을 지원합니다.&#10;# 제목, **굵게**, *기울임*, _밑줄_, ~~취소선~~&#10;- 목록, 1. 번호목록, > 인용, &#96;코드&#96;, | 표 |&#10;[링크](url), --- 가로줄" style="min-height:200px; resize:vertical;"></textarea>
    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button onclick="closeWrite()" class="btn-back">취소</button>
      <button onclick="submitPost()" class="btn-write">등록</button>
    </div>
  </div>
</div>

<script>
  let posts = [];
  let currentIdx = null; 
  let isEditMode = false;
  
  const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

  window.onload = function() {
    if (isLoggedIn) {
      document.getElementById('main-write-btn').style.display = 'block';
    }

    const saved = localStorage.getItem('my_posts');
    if (saved) {
      posts = JSON.parse(saved);
      renderList();
    }
    updateAuthUI();
  }

  function updateAuthUI() {
    const authBtn = document.getElementById('auth-btn');
    if (isLoggedIn) {
      authBtn.textContent = '로그아웃';
      authBtn.onclick = function() {
        if (confirm('로그아웃 하시겠습니까?')) {
          localStorage.removeItem('isLoggedIn');
          localStorage.removeItem('userRole');
          alert('로그아웃 되었습니다.');
          window.location.reload();
        }
      };
    } else {
      authBtn.textContent = '로그인';
      authBtn.onclick = function() {
        window.location.href = "./login.html";
      };
    }
  }

  // 전체 마크다운 파서
  function parseContent(text) {
    if(!text) return "";

    // 코드블록 추출
    const codeBlocks = [];
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      codeBlocks.push({ lang: lang || '', code });
      return `\x00CODEBLOCK${codeBlocks.length - 1}\x00`;
    });

    // 인라인 코드 추출
    const inlineCodes = [];
    text = text.replace(/`([^`\n]+?)`/g, (_, code) => {
      const esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      inlineCodes.push(`<code>${esc}</code>`);
      return `\x00INLINE${inlineCodes.length - 1}\x00`;
    });

    // HTML 이스케이프
    text = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // 표
    text = text.replace(/((?:\|.+\|\n?)+)/g, (block) => {
      const rows = block.trim().split('\n').filter(r => r.trim());
      if (rows.length < 2) return block;
      const isSep = r => /^\|[\s\-:|]+\|/.test(r);
      let html = '<table>', inBody = false;
      rows.forEach((row, i) => {
        if (isSep(row)) { inBody = true; return; }
        const cells = row.replace(/^\||\|$/g,'').split('|').map(c => c.trim());
        if (!inBody && i === 0) {
          html += '<thead><tr>' + cells.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
        } else {
          html += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
        }
      });
      return html + '</tbody></table>';
    });

    // 가로줄
    text = text.replace(/^(?:\*\s*){3,}$|^(?:-\s*){3,}$|^(?:_\s*){3,}$/gm, '<hr>');

    // 제목
    text = text.replace(/^(#{1,6})\s+(.+)$/gm, (_, h, t) => `<h${h.length}>${t}</h${h.length}>`);

    // 인용문
    text = text.replace(/((?:^&gt;&gt;\s?.+\n?)+)/gm, (b) =>
      `<blockquote><blockquote><p>${b.replace(/^&gt;&gt;\s?/gm,'').trim()}</p></blockquote></blockquote>\n`);
    text = text.replace(/((?:^&gt;\s?.+\n?)+)/gm, (b) =>
      `<blockquote><p>${b.replace(/^&gt;\s?/gm,'').trim()}</p></blockquote>\n`);

    // 순서 없는 목록
    text = text.replace(/((?:^[ \t]*[-*+] .+\n?)+)/gm, (b) =>
      '<ul>' + b.trim().split('\n').map(l => { const m=l.match(/^[ \t]*[-*+] (.+)/); return m?`<li>${m[1]}</li>`:''; }).join('') + '</ul>\n');

    // 순서 있는 목록
    text = text.replace(/((?:^[ \t]*\d+\. .+\n?)+)/gm, (b) =>
      '<ol>' + b.trim().split('\n').map(l => { const m=l.match(/^[ \t]*\d+\. (.+)/); return m?`<li>${m[1]}</li>`:''; }).join('') + '</ol>\n');

    // 인라인 서식
    text = text.replace(/\*\*([^\*\n]+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_\n]+?)__/g, '<strong>$1</strong>');
    text = text.replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');
    text = text.replace(/\*([^\*\n]+?)\*/g, '<em>$1</em>');
    text = text.replace(/\/\/([^\/\n]+?)\/\//g, '<em>$1</em>');
    text = text.replace(/_([^_\n]+?)_/g, '<u>$1</u>');

    // 이미지 & 링크
    text = text.replace(/!\[([^\]]*?)\]\(([^\)]+?)\)/g, '<img src="$2" alt="$1">');
    text = text.replace(/\[([^\]]+?)\]\(([^\)]+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // 코드블록 복원
    codeBlocks.forEach(({code}, i) => {
      const esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      text = text.replace(`\x00CODEBLOCK${i}\x00`, `<pre><code>${esc.trim()}</code></pre>`);
    });
    inlineCodes.forEach((html, i) => {
      text = text.replace(`\x00INLINE${i}\x00`, html);
    });

    // 단락 처리
    const parts = text.split(/\n{2,}/);
    text = parts.map(part => {
      part = part.trim();
      if (!part) return '';
      if (/^<(h[1-6]|ul|ol|blockquote|pre|table|hr)/.test(part)) return part;
      return `<p>${part.replace(/\n/g,'<br>')}</p>`;
    }).join('\n');

    return text;
  }

  function renderList() {
    const tbody = document.getElementById('post-tbody');
    const empty = document.getElementById('board-empty');
    document.getElementById('post-count').textContent = posts.length;
    
    if (posts.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    
    tbody.innerHTML = posts.slice().reverse().map((p, i) => {
      const actualIdx = posts.length - 1 - i;
      return `
      <tr onclick="viewPost(${actualIdx})">
        <td class="td-num">${actualIdx + 1}</td>
        <td>${p.title}</td>
        <td class="td-date">${p.date}</td>
      </tr>`
    }).join('');
  }

  function openWrite() { 
    if (!isLoggedIn) { alert('로그인 후 이용 가능합니다.'); return; }
    isEditMode = false;
    document.getElementById('modal-title').textContent = "글 작성";
    document.getElementById('input-title').value = '';
    document.getElementById('input-body').value = '';
    document.getElementById('write-modal').classList.add('open'); 
  }

  function openEdit(idx) {
    if (!isLoggedIn) return;
    isEditMode = true;
    currentIdx = idx;
    const p = posts[idx];
    document.getElementById('modal-title').textContent = "글 수정";
    document.getElementById('input-title').value = p.title;
    document.getElementById('input-body').value = p.body;
    document.getElementById('write-modal').classList.add('open');
  }

  function closeWrite() { 
    document.getElementById('write-modal').classList.remove('open');
  }

  function submitPost() {
    if (!isLoggedIn) return;
    const title = document.getElementById('input-title').value.trim();
    const body = document.getElementById('input-body').value; 
    if (!title || !body.trim()) { alert('제목과 내용을 모두 입력해주세요.'); return; }

    const now = new Date();
    const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
    
    if (isEditMode) {
      posts[currentIdx].title = title;
      posts[currentIdx].body = body;
      posts[currentIdx].date = dateStr + " (수정됨)";
    } else {
      posts.push({title, body, date: dateStr});
    }
    
    saveAndRender();
    closeWrite();
    if (isEditMode) viewPost(currentIdx); 
  }

  function viewPost(idx) {
    currentIdx = idx;
    const p = posts[idx];
    document.getElementById('view-title').textContent = p.title;
    document.getElementById('view-meta').textContent = p.date;
    
    document.getElementById('view-body').innerHTML = parseContent(p.body);
    
    const editBtn = document.getElementById('edit-btn');
    const deleteBtn = document.getElementById('delete-btn');
    
    if (isLoggedIn) {
      editBtn.style.display = 'inline-block';
      deleteBtn.style.display = 'inline-block';
      editBtn.onclick = function() { openEdit(idx); };
      deleteBtn.onclick = function() { deletePost(idx); };
    } else {
      editBtn.style.display = 'none';
      deleteBtn.style.display = 'none';
    }

    document.getElementById('list-view').style.display = 'none';
    document.getElementById('post-view').classList.add('open');
  }

  function deletePost(idx) {
    if (!isLoggedIn) return;
    if(confirm('정말 삭제하시겠습니까?')) {
      posts.splice(idx, 1);
      saveAndRender();
      closePost();
    }
  }

  function saveAndRender() {
    localStorage.setItem('my_posts', JSON.stringify(posts));
    renderList();
  }

  function closePost() {
    document.getElementById('list-view').style.display = 'block';
    document.getElementById('post-view').classList.remove('open');
  }
</script>
</body>
</html>
